site_name: eos-sar
site_description: Generic SAR (Synthetic Aperture Radar) processing algorithms
repo_url: https://github.com/Konkrad/eos-sar
repo_name: Konkrad/eos-sar
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Border masking (GRD): border_masking_grd.md
  - API Reference: reference/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            group_by_category: true
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
